<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Dashboard giáo viên</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial; background: #f4f6f9; padding: 20px; }
.container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border-bottom: 1px solid #ddd; }

.count { font-weight: bold; color: #3498db; }
</style>
</head>

<body>

<div class="container">
    <h2>📊 Thống kê số lần hỏi AI</h2>

    <select id="classSelect" onchange="loadStats()"></select>

    <table>
        <thead>
            <tr>
                <th>Học sinh</th>
                <th>Số lần hỏi AI</th>
                <th>Lần gần nhất</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
    </table>
</div>

<script>
const sb = supabase.createClient(
  'https://kisogvsqpimhlqidkekf.supabase.co',
  'sb_publishable_nDW5RCRQYvaZ0-oEQci9jQ_fuwA3i2A'
);

async function init() {
    const { data } = await sb.from('classes').select('*');

    const select = document.getElementById('classSelect');
    select.innerHTML = '<option value="">-- chọn lớp --</option>';

    data.forEach(c => {
        select.innerHTML += `<option value="${c.class_id}">${c.name}</option>`;
    });
}

async function loadStats() {
    const classId = document.getElementById('classSelect').value;
    if (!classId) return;

    const { data: students } = await sb
        .from('students')
        .select('*')
        .eq('class_id', classId);

    const ids = students.map(s => s.student_id);

    const { data: logs } = await sb
        .from('health_logs')
        .select('*')
        .in('student_id', ids);

    const tbody = document.getElementById('body');
    tbody.innerHTML = '';

    students.forEach(s => {
        const myLogs = logs.filter(l => l.student_id === s.student_id);

        const count = myLogs.length;

        const latest = count
            ? myLogs.sort((a,b)=>new Date(b.record_date)-new Date(a.record_date))[0].record_date
            : '-';

        tbody.innerHTML += `
            <tr>
                <td>${s.name}</td>
                <td class="count">${count}</td>
                <td>${latest}</td>
            </tr>
        `;
    });
}

init();
</script>

</body>
</html>
